<style>
  .host {
    width: 200px;
    height: 200px;
    display: inline-block;
    /* width:100%; */
    aspect-ratio: 1/1;
    --rx: 0deg;
    --ry: 45deg;
    --rz: 0deg;

    --rmx: 0deg;
    --rmy: 0deg;
    --rmz: 0deg;
  }

  .container {
    transform-style: preserve-3d;
    width: 100%;
    height: 100%;
    aspect-ratio: 1/1;
    /* container-type: inline-size; */
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dice {
    container-type: inline-size;
    aspect-ratio: 1/1;
    /* pointer-events: none; */
    position: relative;
    margin: 0 auto;
    width: 50%;
    height: 50%;
    transform-style: preserve-3d;
    /* transform: rotateX(calc(var(--rx) + var(--rmx))) rotateY(calc(var(--ry) + var(--rmy))) rotateZ(calc(var(--rz) + var(--rmz))); */
    transform: rotateX(0deg) rotateY(10deg) rotateZ(0deg);
    transition: transform 2s cubic-bezier(.25, .1, .5, 1.1);
  }

  :host(.debug) .face,
  .host.debug .face {
    outline: 2px solid #abc;
    background-color: #cba3;
  }

  :host(.debug) .dice,
  .host.debug .dice {
    transition: none;
  }

  .face {
    position: absolute;
    left: 50%;
    top: 0;
    margin: 0 -50px;
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-bottom: 86px solid rgba(30, 180, 20, 0.75);
    width: 0px;
    height: 0px;
    transform-style: preserve-3d;
    backface-visibility: hidden;
    counter-increment: steps 1;
  }

.face:nth-child(1) { transform: rotateY(0deg) translateZ(33.5px) translateY(-12.9px) rotateX(53deg); }
.face:nth-child(2) { transform: rotateY(-72deg) translateZ(33.5px) translateY(-12.9px) rotateX(53deg); }
.face:nth-child(3) { transform: rotateY(-144deg) translateZ(33.5px) translateY(-12.9px) rotateX(53deg); }
.face:nth-child(4) { transform: rotateY(-216deg) translateZ(33.5px) translateY(-12.9px) rotateX(53deg); }
.face:nth-child(5) { transform: rotateY(-288deg) translateZ(33.5px) translateY(-12.9px) rotateX(53deg); }
.face:nth-child(16) { transform: rotateY(-108deg) translateZ(33.5px) translateY(121.26px) rotateZ(180deg) rotateX(53deg); }
.face:nth-child(17) { transform: rotateY(-36deg) translateZ(33.5px) translateY(121.26px) rotateZ(180deg) rotateX(53deg); }
.face:nth-child(18) { transform: rotateY(36deg) translateZ(33.5px) translateY(121.26px) rotateZ(180deg) rotateX(53deg); }
.face:nth-child(19) { transform: rotateY(108deg) translateZ(33.5px) translateY(121.26px) rotateZ(180deg) rotateX(53deg); }
.face:nth-child(20) { transform: rotateY(180deg) translateZ(33.5px) translateY(121.26px) rotateZ(180deg) rotateX(53deg); }
.face:nth-child(6) { transform: rotateY(360deg) translateZ(75px) translateY(54.18px) rotateZ(180deg) rotateX(-11deg); }
.face:nth-child(7) { transform: rotateY(288deg) translateZ(75px) translateY(54.18px) rotateZ(180deg) rotateX(-11deg); }
.face:nth-child(8) { transform: rotateY(216deg) translateZ(75px) translateY(54.18px) rotateZ(180deg) rotateX(-11deg); }
.face:nth-child(9) { transform: rotateY(144deg) translateZ(75px) translateY(54.18px) rotateZ(180deg) rotateX(-11deg); }
.face:nth-child(10) { transform: rotateY(72deg) translateZ(75px) translateY(54.18px) rotateZ(180deg) rotateX(-11deg); }
.face:nth-child(11) { transform: rotateY(252deg) translateZ(75px) translateY(54.18px) rotateX(-11deg); }
.face:nth-child(12) { transform: rotateY(324deg) translateZ(75px) translateY(54.18px) rotateX(-11deg); }
.face:nth-child(13) { transform: rotateY(396deg) translateZ(75px) translateY(54.18px) rotateX(-11deg); }
.face:nth-child(14) { transform: rotateY(468deg) translateZ(75px) translateY(54.18px) rotateX(-11deg); }
.face:nth-child(15) { transform: rotateY(540deg) translateZ(75px) translateY(54.18px) rotateX(-11deg); }




  .face::after {
    content: "";
    display: block;
    height: 100%;
    clip-path: polygon(50% 0,
        6.69873% 75%,
        93.30127% 75%);
  }

  .face:nth-child(1)::after { background-color: hsl(0deg 80% 70%);    }
  .face:nth-child(2)::after { background-color: hsl(36deg 80% 70%);   }
  .face:nth-child(3)::after { background-color: hsl(72deg 80% 70%);   }
  .face:nth-child(4)::after { background-color: hsl(108deg 80% 70%);    }
  .face:nth-child(5)::after { background-color: hsl(144deg 80% 70%);    }
  .face:nth-child(6)::after { background-color: hsl(180deg 80% 70%);    }
  .face:nth-child(7)::after { background-color: hsl(216deg 80% 70%);    }
  .face:nth-child(8)::after { background-color: hsl(252deg 80% 70%);    }
  .face:nth-child(9)::after { background-color: hsl(288deg 80% 70%);    }
  .face:nth-child(10)::after { background-color: hsl(324deg 80% 70%);    }

  .face:nth-child(11)::after { background-color: hsl(0deg 50% 70%);    }
  .face:nth-child(12)::after { background-color: hsl(36deg 50% 70%);   }
  .face:nth-child(13)::after { background-color: hsl(72deg 50% 70%);   }
  .face:nth-child(14)::after { background-color: hsl(108deg 50% 70%);    }
  .face:nth-child(15)::after { background-color: hsl(144deg 50% 70%);    }
  .face:nth-child(16)::after { background-color: hsl(180deg 50% 70%);    }
  .face:nth-child(17)::after { background-color: hsl(216deg 50% 70%);    }
  .face:nth-child(18)::after { background-color: hsl(252deg 50% 70%);    }
  .face:nth-child(19)::after { background-color: hsl(288deg 50% 70%);    }
  .face:nth-child(20)::after { background-color: hsl(324deg 50% 70%);    }


  
  .face .number {
    position: absolute;
    z-index: 1;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-top: 20%;
    padding-bottom: 25%;
    font-size: max(8px, 40cqw);
    font-weight: 700;
  }
</style>

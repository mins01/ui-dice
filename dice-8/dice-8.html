    <script type="module">
      import Dice8Element from "./Dice8Element.js"
      Dice8Element.define('dice-8');
    </script>
    
</head>
<body>
    <div class="container">
      <h1>ui-dices/dice-8</h1>

      <div class="card">
        <div class="card-header">dice-8</div>
        <div class="card-body">
          <div style="aspect-ratio: 1/1; max-width: 600px; background-color: #ccc;" class="d-flex justify-content-center align-items-center">
            <dice-8 id="dice" role="button"  onpointerdown="this.startRolling()" onpointerup="this.stopRolling()"></dice-8>
          </div>
          <hr>
          <div class="d-flex flex-wrap gap-1">
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').classList.toggle('debug')">debug</button>
          </div>
          <hr>
          <div class="d-flex flex-wrap gap-1">
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').startRolling()">startRolling</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').stopRolling()">stopRolling</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').stopRolling(1)">stopRolling(1)</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').stopRolling(2)">stopRolling(2)</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').stopRolling(3)">stopRolling(3)</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').stopRolling(4)">stopRolling(4)</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').stopRolling(5)">stopRolling(5)</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').stopRolling(6)">stopRolling(6)</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').stopRolling(7)">stopRolling(7)</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').stopRolling(8)">stopRolling(8)</button>

          </div>
          <hr>
          <div class="d-flex flex-wrap gap-1">
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').value = Math.floor(Math.random()*8)+1">value = RAND</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').value = 1">value = 1</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').value = 2">value = 2</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').value = 3">value = 3</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').value = 4">value = 4</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').value = 5">value = 5</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').value = 6">value = 6</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').value = 7">value = 7</button>
            <button class="btn btn-primary btn-sm" onclick="document.querySelector('#dice').value = 8">value = 8</button>
          </div>
        </div>
      </div>
      
    </div>
    <script>
      window.addEventListener('load',()=>{
        const dice = document.getElementById('dice')
        dice.addEventListener('start-rolling',(event)=>{
          console.log(event.type);
        })
        dice.addEventListener('stop-rolling',(event)=>{
          console.log(event.type,event.target.value);
        })
        dice.addEventListener('change',(event)=>{
          console.log(event.type,event.target.value);
        })
      })
    </script>
</body>

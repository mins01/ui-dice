    <style>
      .dice-container{
        min-height: 100px;
        display: grid;
        gap: 8px;
        justify-items: center;
        --column-number:3; 
        grid-template-columns:  repeat(auto-fit, minmax(150px, 1fr));
      }
      .dice{
        max-width: 300px;
      }
    </style>
    <script>
      function clearDices(){
        const dices = document.querySelectorAll('#diceContainer .dice');
        dices.forEach(dice=>{
          dice.remove();
        })
        showResult();
      }
      function addDice(tagname){
        const el = document.createElement(tagname);
        el.classList = 'dice'
        document.querySelector('#diceContainer').append(el);
        showResult();
        const dices = document.querySelectorAll('#diceContainer .dice');
        const diceContainer = document.querySelector('#diceContainer');
        diceContainer.style.setProperty('--column-number',Math.floor(dices.length))
      }
      function rollong(){
        const dices = document.querySelectorAll('#diceContainer .dice');
        const btnRolling = document.getElementById('btnRolling');
        btnRolling.disabled = true;
        clearResult();
        dices.forEach(dice => {
          dice.startRolling()
        })
        const tm = setInterval(()=>{
          showResult()
        },100)
        setTimeout(()=>{
          dices.forEach(dice => {
            dice.stopRolling()
          })
          clearInterval(tm);
          clearResult();
          
          setTimeout(()=>{
            
            showResult()
            btnRolling.disabled = false;

          },2000)
        },1000)

      }
      function showResult(){
        const dices = document.querySelectorAll('#diceContainer .dice');
        const values = [...dices].map(dice => parseInt(dice.value,10));
        console.log(values);
        const resultText = document.getElementById('resultText');
        const sum = values.reduce((total, value) => total + value, 0);

        resultText.value = values.join('+')+' = '+sum
      }
      function clearResult(){
        const resultText = document.getElementById('resultText');
        resultText.value = ''
      }
    </script>



    <script type="module">
      import Dice4Element from "../dice-4/Dice4Element.js";
      Dice4Element.define('dice-4');
      import Dice6Element from "../dice-6/Dice6Element.js";
      Dice6Element.define('dice-6');
      import Dice8Element from "../dice-8/Dice8Element.js";
      Dice8Element.define('dice-8');
      import Dice12Element from "../dice-12/Dice12Element.js";
      Dice12Element.define('dice-12');
      import Dice20Element from "../dice-20/Dice20Element.js";
      Dice20Element.define('dice-20');
      showResult()
    </script>


</head>
<body>
    <div class="container">
      <h1>ui-dice/sample</h1>
      <!-- Hover added -->
      <div class="card">
        <div class="card-header">
          <h2>DICE</h2>
        </div>
        <div class="card-body">
          <div class="dice-container"  id="diceContainer">
            <dice-4 class="dice"></dice-4>
            <dice-6 class="dice"></dice-6>
            <dice-8 class="dice"></dice-8>
            <dice-12 class="dice"></dice-12>
            <dice-20 class="dice"></dice-20>
          </div>
          <hr>
          <h4>결과</h4>
          <div class="d-flex gap-1">
            <input type="text" class="form-control" id="resultText">
          </div>
          <div class="d-flex gap-1 mt-3 justify-content-center">
            <button class="btn btn-primary" type="button" id="btnRolling" onclick="rollong();">rolling</button>
          </div>
          <div class="d-flex flex-wrap gap-1 mt-3 justify-content-center">
            <button class="btn btn-primary" type="button" onclick="clearDices()">clearDices</button>
            <button class="btn btn-primary" type="button" onclick="addDice('dice-4')">addDice('dice-4')</button>
            <button class="btn btn-primary" type="button" onclick="addDice('dice-6')">addDice('dice-6')</button>
            <button class="btn btn-primary" type="button" onclick="addDice('dice-8')">addDice('dice-8')</button>
            <button class="btn btn-primary" type="button" onclick="addDice('dice-12')">addDice('dice-12')</button>
            <button class="btn btn-primary" type="button" onclick="addDice('dice-20')">addDice('dice-20')</button>
          </div>

          
        </div>
      </div>
      
      
    </div>
